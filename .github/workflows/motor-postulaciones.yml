name: Motor de postulaciones

on:
  schedule:
    - cron: "0 8 * * 4"      # todos los jueves a las 3:00 a. m. de Lima (jueves 08:00 UTC)
  workflow_dispatch:         # botón para ejecutarlo a mano
    inputs:
      solo:
        description: "Correo de un alumno (vacío = todos)"
        required: false
        default: ""
      forzar:
        description: "Volver a elegir aunque ya tenga ofertas esta semana (si / no)"
        required: false
        default: "no"

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Elegir las ofertas de cada alumno
        run: node scripts/motor.js
        env:
          CAMPUS_SA: ${{ secrets.CAMPUS_SA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOLO: ${{ github.event.inputs.solo }}
          FORZAR: ${{ github.event.inputs.forzar }}
